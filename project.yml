name: MoFang-IOS
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  MoFang-IOS:
    type: application
    platform: iOS
    sources:
      - MoFang-IOS
    info:
      path: MoFang-IOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: MoFang-IOS
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mofang.ios
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
